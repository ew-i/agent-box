name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --dev --python 3.15

      - name: PEP 8 and static checks
        run: uv run ruff check --output-format=github src tests

      - name: Formatting
        run: uv run ruff format --check --diff src tests

      - name: Types (mypy)
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest --cov-report=xml:coverage.xml

      - name: Make code coverage badge
        if: matrix.python-version == '3.15'
        run: |
          mkdir -p output
          uv run genbadge coverage -i coverage.xml -o output/coverage.svg

      - name: Publish coverage badge
        if: matrix.python-version == '3.15' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BADGE_TOKEN: ${{ secrets.BADGE_TOKEN }}
        run: |
          set -euo pipefail
          helper='!f() { echo "username=x-access-token"; echo "password=$BADGE_TOKEN"; }; f'
          git -c credential.helper="$helper" clone "https://github.com/ew-i/badges.git" badges
          mkdir -p badges/agent-box
          cp output/coverage.svg badges/agent-box/coverage.svg
          cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-box/coverage.svg
          git commit -m "Update agent-box coverage badge" || exit 0
          git -c credential.helper="$helper" push
  build:
    name: Build package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
